<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8eeeff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='13' fill='%2342bfd0'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='25' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <title>Aero Reef — Frutiger Aero Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Aero Reef home"><span class="brand-mark">✦</span><span>AERO<span class="brand-light">REEF</span></span></a>
      <div class="top-note"><span class="live-dot"></span> A little ocean of calm</div>
      <button class="sound-button glass-button" id="soundButton" aria-label="Toggle sound" title="Toggle sound">♫ <span>Sound on</span></button>
    </header>

    <section class="game-wrap" aria-label="Aero Reef game">
      <canvas id="game" aria-label="Swim through the reef and collect pearls"></canvas>
      <div class="vignette"></div>
      <div class="hud" id="hud" aria-live="polite">
        <div class="hud-card score-card"><span class="hud-label">PEARLS</span><span class="score-line"><span class="pearl-icon">✧</span><strong id="score">0</strong><span class="score-target">/ 12</span></span><div class="progress-track"><i id="progress"></i></div></div>
        <div class="hud-card air-card"><span class="hud-label">OXYGEN</span><span class="air-line"><span class="air-icon">◉</span><strong id="airText">100%</strong></span><div class="progress-track air-track"><i id="airBar"></i></div></div>
        <button class="pause-button glass-button" id="pauseButton" aria-label="Pause game" title="Pause">Ⅱ</button>
      </div>
      <div class="center-overlay" id="overlay">
        <div class="overlay-card glass-panel" id="overlayCard">
          <div class="eyebrow"><span>✦</span> A FRUTIGER AERO ADVENTURE</div>
          <div class="mascot" aria-hidden="true"><span class="mascot-shine"></span><span class="mascot-eye"></span><span class="mascot-fin">⌁</span></div>
          <h1 id="overlayTitle">Aero <em>Reef</em></h1>
          <p id="overlayText">Slip into a sunlit blue world.<br>Find the pearls. Follow the bubbles.</p>
          <div class="how-to" id="instructions"><span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span><span class="or">or</span><span class="keycap wide">← ↑ ↓ →</span><span class="instructions-text">to swim</span></div>
          <button class="primary-button" id="startButton">Dive in <span>↗</span></button>
          <div class="best-note" id="bestNote">BEST DIVE <b id="bestScore">0</b> / 12</div>
        </div>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="mobile-controls" id="mobileControls" aria-label="Touch swim controls">
        <button class="dpad up" data-dir="up" aria-label="Swim up">⌃</button>
        <button class="dpad left" data-dir="left" aria-label="Swim left">‹</button>
        <button class="dpad down" data-dir="down" aria-label="Swim down">⌄</button>
        <button class="dpad right" data-dir="right" aria-label="Swim right">›</button>
      </div>
    </section>
    <footer class="footer"><span>✧ <b>12 pearls</b> to bring the reef back to life</span><span class="footer-right">A tiny escape for a brighter day <span>◌</span></span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
